name: CI

on:
  push:
    branches: [main]
  pull_request:

# External PRs are untrusted input: read-only token, no secrets exposed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA rather than a tag. Tags are
# mutable: whoever controls the action's repo can repoint `v4` at anything,
# and it would run here with our checkout. The trailing comment is the
# readable version, and Dependabot (.github/dependabot.yml) keeps SHA and
# comment in step.
jobs:
  build:
    name: Build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the token in .git/config
          # would expose it to every later step, which on a pull request means
          # exposing it to a contributor's code.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  # The README quickstart is `docker compose up`, and this job is what keeps
  # that promise honest: a clean clone must reach a healthy app in one
  # command on every push (docs/stack.md, Phase 0).
  compose:
    name: docker compose up from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Boot the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Probe /api/health
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors http://localhost:3000/api/health
          echo
          echo "healthy"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
