# The whole quickstart: `docker compose up` from a clean clone reaches a
# working app on http://localhost:3000 with no .env, no signup, no API key.
# CI boots this file on every push so the promise can never silently break
# (.github/workflows/ci.yml).
#
# Every default below is for local use. For anything internet-facing, set
# BETTER_AUTH_SECRET (openssl rand -base64 32) and a real Postgres password —
# see .env.example.

name: growthmind

services:
  postgres:
    # pgvector ships in the image so embeddings never need a second datastore
    # or a later extension migration (docs/stack.md, Phase 1).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: growthmind
      # Demo default, safe only because the port below is loopback-bound.
      # Override in .env for anything real.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-growthmind}"
      POSTGRES_DB: growthmind
    ports:
      # Loopback only. Published on 0.0.0.0 this is a complete cross-tenant
      # breach reachable without touching the app: read the session table,
      # read or write every org's rows. `web` and `worker` reach Postgres over
      # the compose network and do not need this mapping at all — it exists
      # solely so an operator can attach psql/drizzle-kit from the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthmind -d growthmind"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Growthmind's own analytics, forwarded to the BUILD and not to the runtime
      # environment below: Next.js inlines NEXT_PUBLIC_* when it compiles. Valueless
      # for the same reason as the Slack pair — unset is the supported self-host
      # state, and it disables analytics rather than failing.
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:
        NEXT_PUBLIC_POSTHOG_HOST:
        NEXT_PUBLIC_POSTHOG_ASSETS_HOST:
        NEXT_PUBLIC_POSTHOG_UI_HOST:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://growthmind:${POSTGRES_PASSWORD:-growthmind}@postgres:5432/growthmind"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-dev-only-secret-change-me-32-chars!}"
      # Explicit opt-in to the demo secrets above. The app refuses to start in
      # production on the public example values unless this is set, so a real
      # deployment fails loudly instead of signing sessions with a secret
      # published in this repo. DELETE THIS LINE when you deploy for real.
      # Published dev-only key so a clean clone boots (O-003 D-1). It is refused
      # at the *encryption call site* in production regardless of the flag
      # above — see packages/shared/src/crypto/credential-key.ts — because its
      # blast radius is a customer PostHog account, not just this deployment.
      GROWTHMIND_ENCRYPTION_KEY: "${GROWTHMIND_ENCRYPTION_KEY:-Z3Jvd3RobWluZC1kZXYtb25seS1lbmNyeXB0aW9uISE=}"
      GROWTHMIND_ALLOW_INSECURE_DEFAULTS: "1"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      # The Slack app's credentials, passed through in the VALUELESS form on
      # purpose.
      #
      # Compose forwards only what this block lists, so without these two lines
      # a value set in `.env` reaches compose's own interpolation and never the
      # app: `slackOAuthConfigured` reads false, the "Add to Slack" control
      # never renders, and a founder is quietly handed the pasted-token path on
      # an installation that HAS a Slack app. Nothing errors. That is a
      # producer/consumer break one layer below the code, and the worker's
      # `ANTHROPIC_API_KEY` block already carries the same warning.
      #
      # `SLACK_CLIENT_ID:` and NOT `"${SLACK_CLIENT_ID:-}"`. Both are
      # `.min(1).optional()` in `packages/shared/src/env.ts`, so the fallback
      # form hands the schema an EMPTY STRING — a validation failure — where
      # absence is the legitimate, supported state. Valueless means "forward it
      # if the host has it, otherwise leave it unset", which is exactly the
      # self-host contract: no Slack app, no OAuth path, product still works.
      SLACK_CLIENT_ID:
      SLACK_CLIENT_SECRET:
      # The same valueless form for the same reason. Read only here: the worker never
      # answers a Slack button press, and requiring it of that process would buy nothing.
      SLACK_SIGNING_SECRET:
      # Social sign-in, same valueless both-or-neither shape as the pair above: one half
      # alone renders a button whose callback cannot complete.
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
      # Read here to answer "is the interest note configured" on the first-run screen; the
      # worker holds the same value to do the posting.
      INTEREST_SLACK_WEBHOOK:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; bun is the probe. /api/health checks Postgres
      # reachability too, so "healthy" means the whole stack works.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://growthmind:${POSTGRES_PASSWORD:-growthmind}@postgres:5432/growthmind"
      # No BETTER_AUTH_* here: this process never reads them, and requiring them of it
      # crash-looped a deployment that had set them on web alone.
      # Explicit opt-in to the demo secrets above. The app refuses to start in
      # production on the public example values unless this is set, so a real
      # deployment fails loudly instead of signing sessions with a secret
      # published in this repo. DELETE THIS LINE when you deploy for real.
      # Published dev-only key so a clean clone boots (O-003 D-1). It is refused
      # at the *encryption call site* in production regardless of the flag
      # above — see packages/shared/src/crypto/credential-key.ts — because its
      # blast radius is a customer PostHog account, not just this deployment.
      GROWTHMIND_ENCRYPTION_KEY: "${GROWTHMIND_ENCRYPTION_KEY:-Z3Jvd3RobWluZC1kZXYtb25seS1lbmNyeXB0aW9uISE=}"
      GROWTHMIND_ALLOW_INSECURE_DEFAULTS: "1"
      # The interest note's webhook, read by this process's minutely tick. Valueless
      # pass-through: the variable is `z.url().optional()`, so an empty string is a
      # validation failure where absence is the supported state.
      INTEREST_SLACK_WEBHOOK:
      # The analysis lane's model key, and which model it asks. Forwarded ONLY
      # here: the worker is where the lane runs, and a key set in .env that
      # never crossed into this container was a wire that looked connected and
      # was not — the lane silently produced findings with no written
      # explanation and no way to tell that from "no key was set".
      # Written with NO VALUE on purpose — the compose pass-through form, which
      # forwards the variable when the host or .env has it and leaves it UNSET
      # when they do not. Not `"${VAR:-}"`: that spelling sets the variable to
      # an empty string, and both of these are `z.string().min(1).optional()` in
      # packages/shared/src/env.ts, where a present-but-empty value is a
      # validation FAILURE. A keyless `docker compose up` from a clean clone
      # would then crash the worker at startup instead of doing what it does
      # today — see no key, select the no-key branch, and ship every finding
      # carrying its numbers with no written explanation attached.
      ANTHROPIC_API_KEY:
      GROWTHMIND_COLDSTART_MODEL:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
